# A maze for cave.py. Draw each level's map with # for rock; anything else is
# open. > is steps down and < is steps up: steps down need steps up at the
# same place on the level below. Letters mark places that have a name and a
# description under `rooms` (each letter once, on any level). A room with
# `goal: true` ends the game when you reach it. A maze with only one level can
# give its `map` without `levels`.
title: The Old Mine
start: {at: A, facing: east}
passage: A narrow passage, cut through the rock.
levels:
  - map: |
      ###########
      #A  #    B#
      # # # ### #
      # #   #   #
      # ##### # #
      #   C #  >#
      ###########
  - map: |
      ###########
      #E  #     #
      # # # ### #
      #   #   # #
      ### ### # #
      #D      #<#
      ###########
rooms:
  A:
    name: Mine entrance
    description: >
      Daylight fades behind you. A cold draught
      blows from somewhere ahead.
  B:
    name: Flooded chamber
    description: Water drips steadily from the roof.
  C:
    name: Old workings
    description: Rusty tools lie where the miners left them.
  D:
    name: Still pool
    description: Black water, perfectly still. Something glints beneath it.
  E:
    name: The way out
    description: A glimmer of daylight! You have found the way out.
    goal: true
